<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Fish Tank</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <section id="preview-shell" class="preview-shell" aria-label="16:9 scene preview">
        <canvas id="scene" class="scene-canvas"></canvas>
        <div class="camera-frame" aria-hidden="true"></div>
      </section>
      <section class="panel" aria-label="Fish tank controls">
        <div class="playback-controls" aria-label="Simulation playback controls">
          <button id="playback-toggle" class="toggle-button" type="button" aria-pressed="false">
            Pause
          </button>
          <button id="step-frame" type="button" disabled>Step</button>
        </div>

        <label>
          Separation
          <input id="separation" type="range" min="0" max="3" step="0.1" value="1.8" />
          <output id="separation-value">1.8</output>
        </label>

        <label>
          Alignment
          <input id="alignment" type="range" min="0" max="3" step="0.1" value="1.2" />
          <output id="alignment-value">1.2</output>
        </label>

        <label>
          Cohesion
          <input id="cohesion" type="range" min="0" max="3" step="0.1" value="0.8" />
          <output id="cohesion-value">0.8</output>
        </label>

        <label>
          Fish
          <input id="count" type="range" min="1" max="72" step="1" value="32" />
          <output id="count-value">32</output>
        </label>

        <label>
          Avoidance
          <input id="avoidance" type="range" min="2" max="18" step="0.5" value="4" />
          <output id="avoidance-value">4</output>
        </label>

        <label>
          Turn rate
          <input id="turn-rate" type="range" min="0.2" max="20" step="0.1" value="18" />
          <output id="turn-rate-value">18</output>
        </label>
      </section>

      <section class="panel camera-panel" aria-label="Camera controls">
        <div class="camera-view-controls" aria-label="Camera view presets">
          <button type="button" data-camera-view="x">X</button>
          <button type="button" data-camera-view="y">Y</button>
          <button type="button" data-camera-view="z">Z</button>
          <button type="button" data-camera-view="default">Default</button>
        </div>

        <div class="camera-action-controls">
          <button id="free-camera-toggle" class="toggle-button" type="button" aria-pressed="false">
            Free Camera
          </button>
          <button id="copy-camera-json" type="button">Copy JSON</button>
        </div>

        <p id="copy-camera-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
