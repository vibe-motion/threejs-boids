<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Bait Ball</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="app">
      <section id="preview-shell" class="preview-shell" aria-label="16:9 scene preview">
        <canvas id="scene" class="scene-canvas"></canvas>
        <div class="camera-frame" aria-hidden="true"></div>
      </section>
      <section class="panel" aria-label="Bait ball controls">
        <div class="playback-controls" aria-label="Simulation playback controls">
          <button id="playback-toggle" class="toggle-button" type="button" aria-pressed="false">
            Pause
          </button>
          <button id="step-frame" type="button" disabled>Step</button>
        </div>

        <label>
          Separation
          <input id="separation" type="range" min="0" max="3" step="0.1" value="3" />
          <output id="separation-value">3</output>
        </label>

        <label>
          Alignment
          <input id="alignment" type="range" min="0" max="3" step="0.1" value="0.5" />
          <output id="alignment-value">0.5</output>
        </label>

        <label>
          Cohesion
          <input id="cohesion" type="range" min="0" max="3" step="0.1" value="0.9" />
          <output id="cohesion-value">0.9</output>
        </label>

        <label>
          Centering
          <input id="centering" type="range" min="0" max="4" step="0.1" value="1.4" />
          <output id="centering-value">1.4</output>
        </label>

        <label>
          Swirl
          <input id="swirl" type="range" min="0" max="4" step="0.1" value="1.9" />
          <output id="swirl-value">1.9</output>
        </label>

        <label>
          Fish
          <input id="count" type="range" min="1" max="512" step="1" value="512" />
          <output id="count-value">512</output>
        </label>

        <label>
          Turn rate
          <input id="turn-rate" type="range" min="0.2" max="20" step="0.1" value="18" />
          <output id="turn-rate-value">18</output>
        </label>

        <h3>Render</h3>

        <label>
          Motion blur
          <input
            id="motion-blur-intensity"
            type="range"
            min="0"
            max="0.92"
            step="0.01"
            value="0.18"
          />
          <output id="motion-blur-intensity-value">0.18</output>
        </label>

        <h3>Model</h3>

        <label>
          Rotation X
          <input id="model-rotation-x" type="range" min="-180" max="180" step="1" value="18" />
          <output id="model-rotation-x-value">18</output>
        </label>

        <label>
          Rotation Y
          <input id="model-rotation-y" type="range" min="-180" max="180" step="1" value="100" />
          <output id="model-rotation-y-value">100</output>
        </label>

        <label>
          Rotation Z
          <input id="model-rotation-z" type="range" min="-180" max="180" step="1" value="64" />
          <output id="model-rotation-z-value">64</output>
        </label>

        <label>
          Brightness
          <input id="model-brightness" type="range" min="0.5" max="2" step="0.01" value="1.58" />
          <output id="model-brightness-value">1.58</output>
        </label>

        <label>
          Glow
          <input id="model-emissive-intensity" type="range" min="0" max="1.5" step="0.01" value="0" />
          <output id="model-emissive-intensity-value">0</output>
        </label>

        <div class="panel-action-controls">
          <button id="copy-panel-params" type="button">Copy Params</button>
        </div>

        <p id="copy-panel-params-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>

      <section class="panel camera-panel" aria-label="Camera controls">
        <div class="camera-view-controls" aria-label="Camera view presets">
          <button type="button" data-camera-view="x">X</button>
          <button type="button" data-camera-view="y">Y</button>
          <button type="button" data-camera-view="z">Z</button>
          <button type="button" data-camera-view="default">Default</button>
        </div>

        <div class="camera-action-controls">
          <button id="free-camera-toggle" class="toggle-button" type="button" aria-pressed="false">
            Free Camera
          </button>
          <button id="copy-camera-json" type="button">Copy JSON</button>
        </div>

        <p id="copy-camera-status" class="copy-status" role="status" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
